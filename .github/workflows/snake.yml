name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 / Asia-Shanghai 08:00
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-snake-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate both Tokyo Night themes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#217594&color_dots=#f7f9fc,#d1dccb,#a4ba96,#769761,#48752c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#7dcfff&color_dots=#1a1b27,#3b4838,#5c7548,#7da159,#9ece6a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the SVGs on output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
