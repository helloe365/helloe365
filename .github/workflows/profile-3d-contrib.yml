name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "30 0 * * *" # 每天 UTC 00:30（北京时间 08:30）自动运行
  workflow_dispatch: # 支持手动触发
  push:
    branches:
      - main
      - master

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Generate 3D contribution SVG

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A profile-3d-contrib
          git commit -m "chore: update 3d-contrib [skip ci]" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
