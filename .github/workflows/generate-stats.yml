name: Generate Local Stats SVGs

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）自动运行
  workflow_dispatch: # 支持手动触发
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats/
          git commit -m "chore: update local stats [skip ci]" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
