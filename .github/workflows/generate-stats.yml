name: Generate Local Stats SVGs

on:
  schedule:
    - cron: "0 2 * * *" # UTC 02:00 / Asia-Shanghai 10:00
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/generate-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-default-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate profile illustrations
        run: python scripts/generate_assets.py

      - name: Fetch GitHub evidence and generate both themes
        run: python scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Verify deterministic replay
        run: |
          sha256sum assets/*.svg stats/*.svg stats/data.json .github/profile-3d-settings.json > "$RUNNER_TEMP/profile.sha256"
          python scripts/generate_assets.py
          python scripts/generate_stats.py --snapshot stats/data.json
          sha256sum --check "$RUNNER_TEMP/profile.sha256"

      - name: Check images, links and anchors
        run: python scripts/check_links.py --timeout 20

      - name: Save the exact input and checksums
        uses: actions/upload-artifact@v4
        with:
          name: profile-evidence
          path: |
            stats/data.json
            ${{ runner.temp }}/profile.sha256

      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- assets/*.svg stats/*.svg stats/data.json .github/profile-3d-settings.json
          if git diff --cached --quiet; then
            echo "Generated files are unchanged."
            exit 0
          fi
          git commit -m "chore: update profile assets [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
