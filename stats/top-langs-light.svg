<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 165" width="400" height="165" fill="none" role="img" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title>Languages by repository bytes</title>
